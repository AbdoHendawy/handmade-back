services:
  postgres:
    image: postgres:16-alpine
    container_name: handmade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-handmade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-handmade}
      POSTGRES_DB: ${POSTGRES_DB:-handmade}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - handmade_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-handmade} -d ${POSTGRES_DB:-handmade}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: handmade-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - handmade_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  handmade_pgdata:
  handmade_minio:
