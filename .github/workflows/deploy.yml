name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-test-push-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify Docker
        run: docker info

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Deploy to EC2 via SSM
        id: deploy
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          EC2_DEPLOY_DIR: ${{ vars.EC2_DEPLOY_DIR }}
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          if [[ -z "$EC2_INSTANCE_ID" || -z "$EC2_DEPLOY_DIR" || -z "$AWS_REGION" || -z "$ECR_REPOSITORY" ]]; then
            echo "Missing required GitHub variables: AWS_REGION, ECR_REPOSITORY, EC2_INSTANCE_ID, EC2_DEPLOY_DIR"
            exit 1
          fi

          HEALTH_EXPORT=""
          if [[ -n "${HEALTH_URL:-}" ]]; then
            HEALTH_EXPORT="export HEALTH_URL='${HEALTH_URL}' && "
          fi

          REMOTE_CMD="set -euo pipefail && cd '${EC2_DEPLOY_DIR}' && git fetch origin main && git checkout main && git pull --ff-only origin main && chmod +x scripts/deploy-api.sh && export API_IMAGE='${IMAGE_URI}' AWS_REGION='${AWS_REGION}' && ${HEALTH_EXPORT}./scripts/deploy-api.sh"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy handmade-api ${IMAGE_TAG}" \
            --parameters "$(jq -nc --arg cmd "$REMOTE_CMD" '{commands: [$cmd]}')" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command id: $COMMAND_ID"

      - name: Wait for deploy command
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i: status=$STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "[StandardOutputContent, StandardErrorContent]" \
                  --output text
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for SSM command $COMMAND_ID"
          exit 1
