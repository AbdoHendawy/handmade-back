name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify Docker
        run: docker info

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test Domain
        run: dotnet test tests/Handmade.Domain.Tests --no-build --configuration Release --verbosity normal

      - name: Test Application
        run: dotnet test tests/Handmade.Application.Tests --no-build --configuration Release --verbosity normal

      - name: Test Architecture
        run: dotnet test tests/Handmade.Architecture.Tests --no-build --configuration Release --verbosity normal

      - name: Test Api
        run: dotnet test tests/Handmade.Api.Tests --no-build --configuration Release --verbosity normal

      - name: Test solution
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Docker build
        run: docker build -t handmade-api:ci .
